    key_groups:
      - age: [*sponge, *squid, *cuttlefish]
        pgp: [*yubikey]
  - path_regex: modules/secrets/anemone.ya?ml$
    key_groups:
      - age: [*sponge, *squid, *anemone]
        pgp: [*yubikey]
  - path_regex: modules/secrets/provision-iso.ya?ml$
    key_groups:
      - age: [*sponge, *squid, *iso]
        pgp: [*yubikey]
  # Common
  - path_regex: modules/secrets/netrc.ya?ml$
    key_groups:
      - age: [*sponge, *squid, *coral, *krill, *cuttlefish, *anemone]
        pgp: [*yubikey]
