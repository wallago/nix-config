      - age: [*sponge, *squid]
        pgp: [*yubikey]
  - path_regex: modules/secrets/squid.ya?ml$
    key_groups:
      - age: [*squid, *sponge]
        pgp: [*yubikey]
  - path_regex: modules/secrets/coral.ya?ml$
